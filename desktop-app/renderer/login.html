
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
  >

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Drone Control System | Login</title>

  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <main class="login-container">

    <section class="login-card">

      <div class="brand">
        <div class="brand-icon">D</div>

        <div>
          <h1>DRONE<span>CORE</span></h1>
          <p>GROUND CONTROL SYSTEM</p>
        </div>
      </div>

      <div class="login-heading">
        <h2>Drone Authentication</h2>
        <p>Sign in to access your assigned drone.</p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="serialNumber">DRONE SERIAL NUMBER</label>

          <input
            type="text"
            id="serialNumber"
            placeholder="Enter drone serial number"
            maxlength="40"
            autocomplete="off"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">PASSWORD</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Enter drone password"
              maxlength="128"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="toggle-password"
              aria-label="Show password"
              title="Show password"
            >
              <svg
                id="eyeIcon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <button type="submit" id="loginButton">
          <span id="buttonText">CONNECT TO DRONE</span>
        </button>

      </form>

      <div class="login-footer">
        <span class="status-indicator"></span>
        SECURE AUTHENTICATION
      </div>

    </section>

    <div class="version">
      DRONE CONTROL SYSTEM · DEVELOPMENT BUILD 1.0.0
    </div>

  </main>

  <script src="js/login.js"></script>

</body>
</html>
